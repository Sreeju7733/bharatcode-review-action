name: "BharatCode PR Reviewer by Flovo"
description: "Open-source AI pull request reviewer by Flovo: inline comments, suggestions, and auto-labels"
author: "Flovo"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  bharatcode-api-key:
    required: true
    description: "BharatCode API key"
  bharatcode-base-url:
    required: false
    default: "https://bharatcode.ai/api/model/v1"
  model:
    required: false
    default: "glm-5.3-flash"
  github-token:
    required: true
    description: "Token with pull-requests: write"

  # Diff handling
  max-diff-chars:
    required: false
    default: "24000"
  max-input-tokens:
    required: false
    default: "60000"
  chunk-strategy:
    required: false
    default: "file"   # file | hunk | token
  ignore-globs:
    required: false
    default: "**/*.lock,**/dist/**,**/*.min.js,**/*.map"
  include-globs:
    required: false
    default: ""

  # Review behavior
  mode:
    required: false
    default: "summary+inline"  # summary | inline | summary+inline | gate
  severity-threshold:
    required: false
    default: "warning"         # info | warning | error
  fail-on-severity:
    required: false
    default: "none"           # none | error | warning
  post-labels:
    required: false
    default: "true"
  label-map:
    required: false
    default: "error:bug,warning:needs-review,info:nit"

  # Reliability
  max-retries:
    required: false
    default: "3"
  request-timeout-ms:
    required: false
    default: "60000"
  concurrency:
    required: false
    default: "3"              # parallel chunk reviews

  # Cost control
  max-usd-budget:
    required: false
    default: "0"              # 0 = unlimited
  dry-run:
    required: false
    default: "false"
  cache-enabled:
    required: false
    default: "true"

  # SARIF output & Code Scanning
  sarif-output:
    required: false
    default: "false"
  sarif-path:
    required: false
    default: "bharatcode-review.sarif"

  # Multi-provider fallback
  fallback-providers:
    required: false
    default: ""               # e.g. "openai,anthropic"
  openai-api-key:
    required: false
    description: "OpenAI API key for fallback"
  anthropic-api-key:
    required: false
    description: "Anthropic API key for fallback"

  # Safety
  allow-forks:
    required: false
    default: "false"
  config-path:
    required: false
    default: ".bharatcode-review.yml"

outputs:
  findings-count:
    description: "Total findings"
  error-count:
    description: "Findings at error severity"
  est-usd:
    description: "Estimated API spend"
  review-url:
    description: "URL of the posted review"

runs:
  using: "node20"
  main: "dist/index.js"
